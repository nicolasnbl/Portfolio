<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="explore.pageTitle">Nicolas · Explorer le monde</title>
    <meta name="description" content="Nicolas Noblet, ingénieur dans le solaire photovoltaïque : parcours, side projects et compétences, dans un portfolio à explorer en 3D." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Aperçu du lien sur LinkedIn et les autres réseaux. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nicolas · Explorer le monde" />
    <meta property="og:description" content="Nicolas Noblet, ingénieur dans le solaire photovoltaïque : parcours, side projects et compétences, dans un portfolio à explorer en 3D." />
    <meta property="og:url" content="https://nicolasnoblet.vercel.app/explore.html" />
    <meta property="og:image" content="https://nicolasnoblet.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Version anglaise choisie : textes masqués jusqu'à leur traduction (src/i18n/page.js).
      try {
        const lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang');
        if (lang === 'en') document.documentElement.classList.add('i18n-wait');
      } catch {}
    </script>
    <style>
      .i18n-wait [data-i18n] { visibility: hidden; }
    </style>
  </head>
  <body class="explore-body">
    <canvas id="scene"></canvas>
    <!-- Même texte que EXPLORE.quote (src/config.js) : affiché dès le chargement, avant le script. -->
    <p data-i18n="explore.quote" class="explore-quote" style="opacity: 1">C’est en osant rêver l’impossible que l’esprit créatif repousse les frontières du possible.</p>
    <div class="explore-ui"></div>
    <script type="module" src="/src/explore/main.js"></script>
  </body>
</html>
